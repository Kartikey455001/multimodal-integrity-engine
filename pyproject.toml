[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-integrity-engine"
version = "0.1.0"
description = "Explainable offline multimodal submission integrity prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6.0,<7", "pydantic>=2.7,<3"]

[project.optional-dependencies]
documents = ["PyMuPDF>=1.24", "python-docx>=1.1"]
ml = ["sentence-transformers>=3.0", "faster-whisper>=1.0", "scikit-learn>=1.5"]
media = ["av>=13.0"]
test = ["pytest>=8.0", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
